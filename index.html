<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記憶なき告発者 ～NEMESIS: 2087～</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

:root {
  --bg:    #080c1a;
  --bg2:   #0d1427;
  --cyan:  #00d4ff;
  --green: #00ff9f;
  --red:   #ff3355;
  --orange:#ff6b35;
  --text:  #d0eeff;
  --bright:#d0eeff;
  --dim:   #d0eeff;
  --font:  'Share Tech Mono','Courier New',monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* iOS Safari: -webkit-fill-available でアドレスバー込みの高さを正確に確保 */
html { height: 100%; }

body {
  background: transparent;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
  height: 100%;
  min-height: -webkit-fill-available;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── TITLE ── */
#title-screen {
  flex: 1;           /* body の縦幅を flex で埋める (dvh 依存しない) */
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 50% 40%, rgba(13,26,58,0.75) 0%, rgba(8,12,26,0.35) 70%);
  position: relative;
  overflow: hidden;
}
#title-screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,212,255,.02) 3px, rgba(0,212,255,.02) 4px
  );
  pointer-events: none;
}
.t-main {
  font-size: clamp(20px,5vw,44px);
  color: var(--cyan);
  text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan);
  letter-spacing: .12em;
  text-align: center;
  margin-bottom: 6px;
}
.t-sub {
  font-size: clamp(12px,2.5vw,19px);
  color: var(--green);
  letter-spacing: .35em;
  text-shadow: 0 0 10px var(--green);
  text-align: center;
  margin-bottom: 10px;
}
.t-year {
  font-size: 12px;
  color: #d0eeff;
  letter-spacing: .2em;
  margin-bottom: 40px;
  text-align: center;
}

/* ── 装飾ライン ── */
.t-deco {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  width: min(380px, 85vw);
}
.t-deco-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,.55), transparent);
}
.t-deco-text {
  color: rgba(0,212,255,.55);
  font-size: 9px;
  letter-spacing: .32em;
  white-space: nowrap;
}

/* ── ボタン点滅 ── */
@keyframes btn-pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--cyan), inset 0 0 8px rgba(0,212,255,.06); }
  50%       { opacity: .45; box-shadow: 0 0 3px var(--cyan); }
}
#start-btn {
  padding: 12px 44px;
  font-family: var(--font);
  font-size: 14px;
  letter-spacing: .2em;
  background: transparent;
  border: 1px solid var(--cyan);
  color: var(--cyan);
  cursor: pointer;
  transition: background .2s, box-shadow .2s;
  animation: btn-pulse 2.4s ease-in-out infinite;
}
#start-btn:hover, #start-btn:active {
  animation-play-state: paused;
  background: rgba(0,212,255,.12);
  box-shadow: 0 0 24px var(--cyan), 0 0 48px rgba(0,212,255,.25);
}

/* ── タイトルグリッチ ── */
.t-main {
  position: relative;
  animation: glitch-skew 14s ease-in-out infinite;
}
.t-main::before,
.t-main::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 0; right: 0;
  overflow: hidden;
  pointer-events: none;
}
.t-main::before {
  color: #ff3355;
  text-shadow: 2px 0 #ff3355;
  animation: glitch-red 14s infinite;
}
.t-main::after {
  color: var(--cyan);
  text-shadow: -2px 0 var(--cyan);
  animation: glitch-blue 14s infinite;
}
@keyframes glitch-skew {
  0%,86%,100% { transform: none; }
  87%          { transform: skewX(-1.5deg) translateX(2px); }
  88%          { transform: none; }
  89%          { transform: skewX(1deg) translateX(-1px); }
  90%          { transform: none; }
}
@keyframes glitch-red {
  0%,86%,100% { opacity:0; clip-path:none; transform:none; }
  87%  { opacity:1; transform:translateX(-5px); clip-path:polygon(0 18%,100% 18%,100% 38%,0 38%); }
  87.6%{ opacity:0; }
  88.5%{ opacity:1; transform:translateX(4px);  clip-path:polygon(0 65%,100% 65%,100% 82%,0 82%); }
  89%  { opacity:0; }
}
@keyframes glitch-blue {
  0%,86%,100% { opacity:0; clip-path:none; transform:none; }
  87%  { opacity:1; transform:translateX(5px);  clip-path:polygon(0 48%,100% 48%,100% 62%,0 62%); }
  87.6%{ opacity:0; }
  88.5%{ opacity:1; transform:translateX(-3px); clip-path:polygon(0 28%,100% 28%,100% 45%,0 45%); }
  89%  { opacity:0; }
}

/* ── GAME SCREEN ── */
#game-screen {
  display: none;        /* startGame() で flex に切り替え */
  flex-direction: column;
  flex: 1;
  min-height: 0;        /* flex overflow を防ぐ必須設定 */
  overflow: hidden;
}

/* HUD */
#hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 14px;
  background: var(--bg2);
  border-bottom: 1px solid var(--cyan);
  box-shadow: 0 2px 10px rgba(0,212,255,.15);
  flex-shrink: 0;
}
#loc-name { color: var(--cyan); font-size: 13px; letter-spacing: .06em; }
#mem-count { color: var(--green); font-size: 12px; }

/* MAIN AREA: output + inventory を横並び */
#main-area {
  display: flex;
  flex: 1;
  min-height: 0;        /* ← これがないと flex 子が overflow する */
  overflow: hidden;
}

/* OUTPUT */
#output-wrap {
  flex: 1;
  min-height: 0;        /* ← 同上 */
  overflow-y: auto;
  padding: 12px 16px;
  -webkit-overflow-scrolling: touch; /* iOS慣性スクロール */
  scrollbar-width: thin;
  scrollbar-color: var(--dim) transparent;
}
#output-wrap::-webkit-scrollbar { width: 3px; }
#output-wrap::-webkit-scrollbar-thumb { background: var(--dim); }

.op { margin-bottom: 8px; }
.op.sep    { color: var(--dim); font-size: 10px; }
.op.loc    { color: var(--cyan); font-size: 15px; border-left: 3px solid var(--cyan); padding-left: 9px; margin-top: 16px; }
.op.flavor { color: #a8d8f0; font-style: italic; }
.op.exits  { color: var(--dim); font-size: 11px; }
.op.pickup { color: #7ec87e; }
.op.desc   { color: #7aaecc; }
.op.event  { color: var(--bright); }
.op.mem    { color: var(--green); border-left: 2px solid var(--green); padding-left: 8px; }
.op.warn   { color: var(--orange); }
.op.used   { color: var(--dim); }

/* INVENTORY SIDEBAR */
#inv-panel {
  width: 160px;
  flex-shrink: 0;
  min-height: 0;
  padding: 10px 9px;
  background: var(--bg2);
  border-left: 1px solid rgba(0,212,255,.15);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.p-title {
  font-size: 9px;
  letter-spacing: .3em;
  color: var(--cyan);
  border-bottom: 1px solid rgba(0,212,255,.22);
  padding-bottom: 4px;
  margin-bottom: 7px;
}
.inv-item {
  font-size: 11px;
  color: var(--text);
  padding: 3px 0;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.inv-item::before { content: '◆ '; color: var(--dim); font-size: 9px; }
#dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  border: 1px solid var(--dim);
  transition: all .4s;
}
.dot.on { background: var(--green); border-color: var(--green); box-shadow: 0 0 5px var(--green); }

/* BUTTON AREA */
#btn-area {
  flex-shrink: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  padding: 8px 12px;
  background: var(--bg2);
  border-top: 1px solid rgba(0,212,255,.15);
  min-height: 48px;
  max-height: 36vh;     /* ← ボタン増加でもレイアウトを壊さない */
  overflow-y: auto;
  align-items: flex-start;
  -webkit-overflow-scrolling: touch;
}
.gbtn {
  padding: 6px 11px;
  font-family: var(--font);
  font-size: 12px;
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--text);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.gbtn.main { border-color: rgba(0,212,255,.38); color: var(--bright); }
.gbtn:hover:not(.off), .gbtn:active:not(.off) {
  border-color: var(--cyan); color: var(--cyan);
  background: rgba(0,212,255,.06); box-shadow: 0 0 8px rgba(0,212,255,.22);
}
.gbtn.cancel { border-color: rgba(255,255,255,.14); color: var(--dim); }
.gbtn.cancel:hover, .gbtn.cancel:active { border-color: var(--orange); color: var(--orange); box-shadow: none; background: transparent; }
.gbtn.danger { border-color: rgba(255,51,85,.4); color: #cc4466; }
.gbtn.danger:hover, .gbtn.danger:active { border-color: var(--red); color: var(--red); box-shadow: 0 0 8px rgba(255,51,85,.28); background: rgba(255,51,85,.05); }
.gbtn.off { opacity: .35; cursor: default; }

/* MEMORY OVERLAY */
#mem-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#mem-box {
  max-width: 520px;
  width: 100%;
  max-height: 88vh;     /* ← 画面からはみ出さない */
  overflow-y: auto;
  border: 1px solid var(--green);
  box-shadow: 0 0 28px var(--green), 0 0 56px rgba(0,255,159,.12);
  background: #050e0a;
  padding: 20px 22px;
  -webkit-overflow-scrolling: touch;
}
.mem-title {
  color: var(--green);
  text-align: center;
  font-size: 12px;
  letter-spacing: .3em;
  border-bottom: 1px solid rgba(0,255,159,.28);
  padding-bottom: 10px;
  margin-bottom: 14px;
  animation: blink 1.6s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
#mem-text {
  color: #90dab0;
  line-height: 1.85;
  min-height: 60px;
  margin-bottom: 18px;
  font-size: 14px;
}
#mem-close {
  display: block;
  margin: 0 auto;
  padding: 8px 28px;
  font-family: var(--font);
  font-size: 12px;
  letter-spacing: .2em;
  background: transparent;
  border: 1px solid var(--green);
  color: var(--green);
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
}
#mem-close.ready { opacity: 1; pointer-events: auto; }
#mem-close:hover, #mem-close:active { background: rgba(0,255,159,.1); }

/* ENDING */
#end-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  text-align: center;
  overflow-y: auto;     /* ← エンディングテキスト長い場合もスクロール可 */
  -webkit-overflow-scrolling: touch;
}
#end-text {
  max-width: 560px;
  font-size: 14px;
  line-height: 2;
  margin-bottom: 32px;
}
#retry-btn {
  padding: 10px 32px;
  font-family: var(--font);
  font-size: 13px;
  letter-spacing: .2em;
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--dim);
  cursor: pointer;
  transition: all .2s;
}
#retry-btn:hover, #retry-btn:active { border-color: var(--cyan); color: var(--cyan); }

/* ── RESPONSIVE (スマホ ≤ 580px) ── */
@media (max-width: 580px) {
  body { font-size: 13px; }

  /* スマホは inventory を下に固定ストリップとして表示 */
  #main-area { flex-direction: column-reverse; }

  #inv-panel {
    width: 100%;
    min-height: unset;
    height: 68px;         /* 固定高さでレイアウト安定 */
    flex-shrink: 0;
    border-left: none;
    border-top: 1px solid rgba(0,212,255,.15);
    overflow-x: auto;
    overflow-y: hidden;
    white-space: nowrap;
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .p-title { display: none; }
  .inv-item { display: inline-block; }
  #dots { flex-wrap: nowrap; }

  #output-wrap { padding: 10px 12px; }

  .gbtn { font-size: 12px; padding: 6px 9px; }
  #btn-area {
    padding: 7px 10px;
    gap: 4px;
    max-height: 30vh;
  }
}

/* ── SAVE / LOAD / ACHIEVEMENTS ── */
#save-btn, #load-btn, #achv-btn {
  font-family: var(--font); font-size: 11px; letter-spacing: .05em;
  color: rgba(0,212,255,.6); background: transparent;
  border: 1px solid rgba(0,212,255,.25); padding: 3px 7px;
  cursor: pointer; transition: all .15s; white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
#save-btn:hover, #save-btn:active,
#load-btn:hover, #load-btn:active,
#achv-btn:hover, #achv-btn:active {
  color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 6px rgba(0,212,255,.25);
}
/* セーブ通知トースト */
#save-toast {
  position: fixed; bottom: 68px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--bg2); border: 1px solid rgba(0,212,255,.4);
  color: var(--cyan); padding: 7px 18px; font-size: 12px;
  font-family: var(--font); opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; z-index: 300; white-space: nowrap;
}
#save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
/* 実績解除トースト */
#achv-toast {
  position: fixed; top: 58px; right: 12px;
  background: var(--bg2); border: 1px solid var(--green);
  box-shadow: 0 0 14px rgba(0,255,159,.25);
  padding: 10px 14px; display: flex; align-items: center; gap: 10px;
  z-index: 300; transform: translateX(120%);
  transition: transform .4s cubic-bezier(.2,.8,.3,1.1); max-width: 230px;
}
#achv-toast.show { transform: translateX(0); }
#achv-toast-icon { font-size: 20px; color: var(--green); line-height: 1; flex-shrink: 0; }
#achv-toast-label { font-size: 9px; letter-spacing: .25em; color: rgba(0,255,159,.65); }
#achv-toast-name  { font-size: 13px; color: var(--green); margin-top: 2px; }
/* 実績一覧オーバーレイ */
#achv-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.88); z-index: 110;
  align-items: center; justify-content: center; padding: 16px;
}
#achv-box {
  max-width: 460px; width: 100%; max-height: 85vh; overflow-y: auto;
  border: 1px solid var(--green);
  box-shadow: 0 0 20px rgba(0,255,159,.18); background: #040e0a;
  padding: 18px 20px; -webkit-overflow-scrolling: touch;
}
.achv-hdr {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(0,255,159,.2); padding-bottom: 9px; margin-bottom: 14px;
}
.achv-ttl { color: var(--green); font-size: 11px; letter-spacing: .3em; }
#achv-x { background: transparent; border: none; color: var(--dim); font-size: 17px; cursor: pointer; padding: 0 3px; }
#achv-x:hover { color: var(--orange); }
.achv-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.05);
}
.achv-ico { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; }
.achv-info { flex: 1; }
.achv-nm  { font-size: 14px; margin-bottom: 3px; }
.achv-ds  { font-size: 11px; }
.achv-item.done .achv-ico { opacity: 1; }
.achv-item.done .achv-nm  { color: var(--bright); }
.achv-item.done .achv-ds  { color: var(--dim); }
.achv-item.lock .achv-ico { opacity: .25; }
.achv-item.lock .achv-nm  { color: var(--dim); }
.achv-item.lock .achv-ds  { color: var(--dim); opacity: .55; }
/* バージョン番号 */
.t-version {
  position: absolute; bottom: 14px; right: 18px;
  font-size: 10px; letter-spacing: .18em; color: rgba(0,212,255,.28);
  font-family: var(--font);
}

/* ── DIFFICULTY & TIMER ── */
.t-diff {
  display: flex;
  gap: 10px;
  margin-top: 8px;
}
.diff-btn {
  padding: 9px 18px;
  font-family: var(--font); font-size: 13px; letter-spacing: .18em;
  background: transparent; cursor: pointer;
  transition: all .2s; -webkit-tap-highlight-color: transparent;
  border: 1px solid rgba(0,212,255,.3); color: rgba(0,212,255,.65);
}
.diff-btn:hover:not(:active), .diff-btn:active {
  background: rgba(0,212,255,.09); color: var(--cyan);
  border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,.28);
}
.diff-easy  { border-color: rgba(0,255,159,.3);  color: rgba(0,255,159,.65); }
.diff-easy:hover:not(:active), .diff-easy:active {
  background: rgba(0,255,159,.08); color: var(--green);
  border-color: var(--green); box-shadow: 0 0 10px rgba(0,255,159,.25);
}
.diff-hard  { border-color: rgba(255,107,53,.3); color: rgba(255,107,53,.65); }
.diff-hard:hover:not(:active), .diff-hard:active {
  background: rgba(255,107,53,.08); color: var(--orange);
  border-color: var(--orange); box-shadow: 0 0 10px rgba(255,107,53,.25);
}
/* 難易度・タイマー（インベントリ内） */
.inv-sub { margin-top: 10px; }
.inv-sub-val { font-size: 12px; margin-top: 2px; }
.inv-sub-val.easy   { color: var(--green); }
.inv-sub-val.normal { color: var(--cyan); }
.inv-sub-val.hard   { color: var(--orange); }
#play-time { color: var(--text); }

/* ── HINT SYSTEM ── */
#hud-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
#hint-btn {
  font-family: var(--font);
  font-size: 11px;
  letter-spacing: .06em;
  color: rgba(0,212,255,.6);
  background: transparent;
  border: 1px solid rgba(0,212,255,.25);
  padding: 3px 8px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
#hint-btn:hover, #hint-btn:active {
  color: var(--cyan);
  border-color: var(--cyan);
  box-shadow: 0 0 6px rgba(0,212,255,.25);
}
#hint-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 110;
  align-items: center;
  justify-content: center;
  padding: 16px;
}
#hint-box {
  max-width: 460px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  border: 1px solid var(--cyan);
  box-shadow: 0 0 20px rgba(0,212,255,.2), 0 0 40px rgba(0,212,255,.08);
  background: #040d1a;
  padding: 18px 20px;
  -webkit-overflow-scrolling: touch;
}
.hint-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(0,212,255,.2);
  padding-bottom: 9px;
  margin-bottom: 13px;
}
.hint-title { color: var(--cyan); font-size: 11px; letter-spacing: .3em; }
#hint-level-ind { font-size: 11px; color: var(--dim); }
#hint-text {
  color: var(--text);
  line-height: 1.9;
  min-height: 48px;
  margin-bottom: 16px;
  font-size: 14px;
}
.hint-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
#hint-more-btn {
  font-family: var(--font); font-size: 12px;
  padding: 6px 13px;
  background: transparent;
  border: 1px solid var(--cyan); color: var(--cyan);
  cursor: pointer; transition: all .15s; letter-spacing: .04em;
}
#hint-more-btn:hover:not([disabled]), #hint-more-btn:active:not([disabled]) {
  background: rgba(0,212,255,.07);
}
#hint-more-btn[disabled] { opacity: .35; cursor: default; }
#hint-close-btn {
  font-family: var(--font); font-size: 12px;
  padding: 6px 13px;
  background: transparent;
  border: 1px solid rgba(255,255,255,.13); color: var(--dim);
  cursor: pointer; transition: all .15s;
}
#hint-close-btn:hover, #hint-close-btn:active { border-color: var(--orange); color: var(--orange); }

/* ── CHARACTER PORTRAIT ── */
/* ── Desktop：インベントリパネルと同幅・同位置に配置しテキストと完全分離 ── */
#char-portrait {
  position: fixed;
  bottom: 88px;          /* ボタンエリア上部まで（btn-area max内） */
  right: 0;
  width: 160px;          /* インベントリパネルと同幅 → テキストエリアには絶対重ならない */
  max-width: 160px;
  height: 42vh;
  object-fit: contain;
  object-position: bottom center;
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transform: translateX(18px);
  transition: opacity .5s ease, transform .5s ease;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 22%);
  mask-image:         linear-gradient(to right, transparent 0%, black 22%);
  filter: drop-shadow(-5px 0 14px rgba(0,0,0,.9));
}
#char-portrait.visible {
  opacity: 1;
  transform: translateX(0);
}

/* ── スマホ：上部右隅（HUD直下）に小さく配置 ──
   テキストは tw() で常に下端にスクロールされるため
   最新テキストと重ならない。上部の読み終えた文と重なるのみ。 ── */
@media (max-width: 580px) {
  #char-portrait {
    top: 46px;             /* HUD直下 */
    bottom: auto;
    right: 0;
    width: auto;
    max-width: 28vw;       /* 375px × 0.28 ≈ 105px 幅 */
    height: 19vh;          /* 812px × 0.19 ≈ 154px 高さ */
    object-position: top center;
    -webkit-mask-image: linear-gradient(to right,  transparent 0%, black 18%),
                        linear-gradient(to bottom, black 60%, transparent 100%);
    mask-image:         linear-gradient(to right,  transparent 0%, black 18%),
                        linear-gradient(to bottom, black 60%, transparent 100%);
    -webkit-mask-composite: destination-in;
    mask-composite: intersect;
  }
}

/* ── STARS ── */
#stars-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
#title-screen, #game-screen, #mem-overlay, #end-screen {
  position: relative;
  z-index: 1;
}
</style>
</head>

let P = {
  loc: 'hospital_room',
  inv: [],
  memCount: 0,
  flags: new Set(),
  visited: new Set(),
  over: false,
};

// ═══════════════════════════════════════════
// ユーティリティ
// ═══════════════════════════════════════════

const sleep = ms => new Promise(r => setTimeout(r, ms));
let resolveMemory = null;
const $ = id => document.getElementById(id);

// ═══════════════════════════════════════════
// テキスト出力
// ═══════════════════════════════════════════

async function tw(text, cls = '', delay = 18) {
  const out = $('output');
  const p = document.createElement('p');
  p.className = 'op ' + cls;
  out.appendChild(p);
  for (const ch of text) {
    if (ch === '\n') p.appendChild(document.createElement('br'));
    else p.insertAdjacentText('beforeend', ch);
    out.scrollTop = out.scrollHeight;
    await sleep(delay);
  }
  out.scrollTop = out.scrollHeight;
}

function fast(text, cls = '') {
  const out = $('output');
  const p = document.createElement('p');
  p.className = 'op ' + cls;
  p.innerHTML = text.replace(/\n/g, '<br>');
  out.appendChild(p);
  out.scrollTop = out.scrollHeight;
}

function sep() { fast('─────────────────────────────', 'sep'); }

// ═══════════════════════════════════════════
// HUD / インベントリ
// ═══════════════════════════════════════════

function hud() {
  $('loc-name').textContent = '■ ' + LOC[P.loc].name;
  $('mem-count').textContent = `記憶: ${P.memCount} / 7`;
}

function refreshInv() {
  const list = $('inv-list');
  if (P.inv.length === 0) {
    list.innerHTML = '<span id="inv-empty" style="color:var(--dim);font-size:12px">空</span>';
  } else {
    list.innerHTML = P.inv.map(id => `<div class="inv-item">${ITEM[id].name}</div>`).join('');
  }
  const dots = $('dots');
  dots.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('span');
    d.className = 'dot' + (i < P.memCount ? ' on' : '');
    dots.appendChild(d);
  }
}

// ═══════════════════════════════════════════
// ボタン
// ═══════════════════════════════════════════

function showBtns(defs) {
  return new Promise(resolve => {
    const area = $('btn-area');
    area.innerHTML = '';
    defs.forEach((b, i) => {
      const el = document.createElement('button');
      el.className = 'gbtn' + (b.main?' main':'') + (b.cancel?' cancel':'') + (b.danger?' danger':'') + (b.off?' off':'');
      el.textContent = (i + 1) + '. ' + b.label;
      if (!b.off) el.addEventListener('click', () => { playClick(); resolve(i); }, { once: true });
      area.appendChild(el);
    });
  });
}

function clearBtns() { $('btn-area').innerHTML = ''; }

// ═══════════════════════════════════════════
// 記憶フラッシュバック
// ═══════════════════════════════════════════

async function memFlash(text) {
  const ov = $('mem-overlay');
  const mt = $('mem-text');
  const mc = $('mem-close');
  mt.innerHTML = '';
  mc.classList.remove('ready');
  ov.style.display = 'flex';
  await sleep(350);
  for (const ch of text) {
    if (ch === '\n') mt.appendChild(document.createElement('br'));
    else mt.insertAdjacentText('beforeend', ch);
    await sleep(20);
  }
  mc.classList.add('ready');
  await new Promise(r => { resolveMemory = r; });
  ov.style.display = 'none';
  resolveMemory = null;
}

// ═══════════════════════════════════════════
// 場所表示
// ═══════════════════════════════════════════

async function showLoc(isMove) {
  const loc = LOC[P.loc];
  hud();

  if (isMove && !P.visited.has(P.loc) && loc.fv) {
    sep();
    await tw(loc.fv, 'flavor');
    await sleep(200);
  }
  P.visited.add(P.loc);

  sep();
  fast('■ ' + loc.name, 'loc');
  await tw(loc.desc, '');

  const pickable = loc.items.filter(id => !ITEM[id].fixed && !P.inv.includes(id));
  const fixed    = loc.items.filter(id =>  ITEM[id].fixed);

  if (pickable.length) fast('床に ' + pickable.map(id => ITEM[id].name).join('、') + ' が落ちている。', 'pickup');
  if (fixed.length)    fast(fixed.map(id => ITEM[id].name).join('、') + ' がある。', 'event');

  const exits = Object.entries(loc.conn).map(([d, dest]) => {
    const locked = loc.lock[d] && !P.flags.has(loc.lock[d].flag);
    return (DIR[d] || d) + '→' + LOC[dest].name + (locked ? '[施錠]' : '');
  });
  if (exits.length) fast('出口: ' + exits.join(' / '), 'exits');

  if (isMove) {
    for (const evId of loc.events) {
      const ev = EV[evId];
      if (ev && ev.doneFlag && !P.flags.has(ev.doneFlag)) {
        await runEv(evId);
        if (P.over) return;
      }
    }
  }
}

// ═══════════════════════════════════════════
// メインループ
// ═══════════════════════════════════════════

const MAIN_MENU = [
  { label:'移動する',           main:true },
  { label:'アイテムを拾う',     main:true },
  { label:'アイテムを調べる',   main:true },
  { label:'アイテムを使う',     main:true },
  { label:'インベントリを確認', main:true },
  { label:'周囲を見回す',       main:true },
];

async function loop() {
  while (!P.over) {
    const c = await showBtns(MAIN_MENU);
    clearBtns();
    await [doMove, doPickup, doInspect, doUse, doInv, doLook][c]();
  }
}

// ═══════════════════════════════════════════
// アクション
// ═══════════════════════════════════════════

async function doMove() {
  const loc = LOC[P.loc];
  const conns = Object.entries(loc.conn);
  const btns = conns.map(([d, dest]) => {
    const locked = loc.lock[d] && !P.flags.has(loc.lock[d].flag);
    return { label: (DIR[d]||d) + ' → ' + LOC[dest].name + (locked ? '  [施錠中]' : '') };
  });
  btns.push({ label:'キャンセル', cancel:true });

  const c = await showBtns(btns);
  clearBtns();
  if (c >= conns.length) return;

  const [d, dest] = conns[c];
  if (loc.lock[d] && !P.flags.has(loc.lock[d].flag)) {
    await tw(loc.lock[d].text, 'warn');
    return;
  }
  P.loc = dest;
  await showLoc(true);
}

async function doPickup() {
  const loc = LOC[P.loc];
  const list = loc.items.filter(id => !ITEM[id].fixed && !P.inv.includes(id));
  if (!list.length) { await tw('拾えるアイテムはない。', 'warn'); return; }

  const btns = list.map(id => ({ label: ITEM[id].name }));
  btns.push({ label:'キャンセル', cancel:true });

  const c = await showBtns(btns);
  clearBtns();
  if (c >= list.length) return;

  const id = list[c];
  P.inv.push(id);
  refreshInv();
  checkCollector();
  await tw(ITEM[id].pt, 'pickup');
}

async function doInspect() {
  const loc = LOC[P.loc];
  const fx = loc.items.filter(id => ITEM[id].fixed);
  const all = [...P.inv, ...fx];
  if (!all.length) { await tw('調べられるものがない。', 'warn'); return; }

  const btns = all.map(id => ({ label: ITEM[id].name + (fx.includes(id) ? '  [設置物]' : '') }));
  btns.push({ label:'キャンセル', cancel:true });

  const c = await showBtns(btns);
  clearBtns();
  if (c >= all.length) return;

  const id = all[c];
  // ハードモードはアイテム説明を1行目のみ表示
  const desc = (_difficulty === 'hard') ? ITEM[id].desc.split('\n')[0] : ITEM[id].desc;
  await tw(desc, 'desc');

  if (ITEM[id].ie) {
    const ev = EV[ITEM[id].ie];
    if (!ev.flag || !P.flags.has(ev.flag)) await runEv(ITEM[id].ie);
  }
}

async function doUse() {
  const loc = LOC[P.loc];
  const inv = P.inv.filter(id => ITEM[id].usable);
  const fx  = loc.items.filter(id => ITEM[id].fixed && ITEM[id].usable);
  const all = [...inv, ...fx];
  if (!all.length) { await tw('使えるアイテムがない。', 'warn'); return; }

  const btns = all.map(id => ({ label: ITEM[id].name + (fx.includes(id) ? '  [設置物]' : '') }));
  btns.push({ label:'キャンセル', cancel:true });

  const c = await showBtns(btns);
  clearBtns();
  if (c >= all.length) return;

  const id = all[c];
  if (ITEM[id].ue) await runEv(ITEM[id].ue);
}

async function doInv() {
  if (!P.inv.length) {
    await tw('インベントリは空だ。', 'warn');
  } else {
    await tw('[ 所持アイテム ]\n' + P.inv.map(id => '・' + ITEM[id].name).join('\n'), 'event');
  }
  await tw('記憶の断片: ' + P.memCount + ' / 7' + (P.memCount === 7 ? '  ★ すべて回収済み' : ''), 'mem');
}

async function doLook() { await showLoc(false); }

// ═══════════════════════════════════════════
// イベント
// ═══════════════════════════════════════════

async function runEv(id) {
  const ev = EV[id];
  if (!ev) return;
  const fn = { memory:evMemory, encounter:evEncounter, story:evStory, ending_check:evEndCheck, ending:evEnding }[ev.type];
  if (fn) await fn(ev);
}

async function evMemory(ev) {
  if (P.flags.has(ev.flag)) return;
  playMemory();   // フラッシュバック演出と同時に再生開始
  await memFlash(ev.frag);
  P.flags.add(ev.flag);
  P.memCount++;
  hud(); refreshInv();
  checkFullMemory();
  showChar('kira');   // 記憶が戻るシーンでキラのポートレートを表示
  await tw('✦ ' + ev.sum, 'mem');
  if (P.memCount === 7) { await sleep(200); await tw('★ すべての記憶が戻った。真実が見えてきた。', 'mem'); }
  hideChar(3500);     // 3.5秒後に自動的にフェードアウト
}

async function evEncounter(ev) {
  if (P.flags.has(ev.doneFlag)) return;
  if (ev.character) showChar(ev.character);  // エンカウンター開始時にキャラクター表示
  await tw(ev.text, 'event');
  await sleep(200);

  let sel = null;
  while (!sel) {
    const btns = ev.choices.map(c => ({
      label: c.label + (c.need && !P.inv.includes(c.need) ? '  ※ ' + ITEM[c.need].name + 'が必要' : ''),
      danger: c.bad,
    }));
    const c = await showBtns(btns);
    clearBtns();
    const choice = ev.choices[c];
    if (choice.need && !P.inv.includes(choice.need)) {
      await tw('しかし、' + ITEM[choice.need].name + 'を持っていない。', 'warn');
    } else {
      sel = choice;
    }
  }

  await tw(sel.res, 'event');
  P.flags.add(sel.flag);
  P.flags.add(ev.doneFlag);
  if (ev.character) hideChar(sel.bad ? 0 : 2000);  // 会話終了後にキャラクターをフェードアウト
  if (sel.bad) { await sleep(700); await runEv('bad_ending_caught'); }
}

async function evStory(ev) {
  if (ev.reqLoc && P.loc !== ev.reqLoc) { await tw(ev.noLocText || 'ここでは使えない。', 'warn'); return; }
  if (ev.reqFlag && !P.flags.has(ev.reqFlag)) { await tw(ev.noFlagText || '何も起きなかった。', 'warn'); return; }
  if (ev.unlockFlag && P.flags.has(ev.unlockFlag)) { await tw('（すでに使用済みだ）', 'used'); return; }
  await tw(ev.text, 'event');
  if (ev.unlockFlag) P.flags.add(ev.unlockFlag);
  if (ev.sum) { await sleep(150); await tw('✦ ' + ev.sum, 'mem'); }
}

async function evEndCheck() {
  if (P.loc !== 'rooftop') { await tw('ここでは使えない。', 'warn'); return; }

  if (!P.inv.includes('data_chip')) {
    // データチップなし → ノーマルエンディングの選択肢を提示
    await tw('端末のスロットが空だ。送信するデータが必要だ。\n\n……このまま逃げることもできる。', 'warn');
    await sleep(300);
    const c = await showBtns([
      { label: '引き返して証拠チップを探す' },
      { label: 'データを諦め、ここから脱出する', danger: true },
    ]);
    clearBtns();
    if (c === 1) { await sleep(300); await runEv('normal_ending'); }
    return;
  }

  await sleep(300);

  // エンディング優先順位: シークレット > トゥルー > グッド
  const hasSecret = P.flags.has('decoded_nexus_order') && P.flags.has('knows_motivation');
  const hasTrue   = P.memCount === 7;

  if (hasSecret)     await runEv('secret_ending');
  else if (hasTrue)  await runEv('true_ending');
  else               await runEv('good_ending');
}

async function evEnding(ev) {
  P.over = true;
  pauseTimer();
  checkEndingAch(ev.result);
  clearBtns();

  // エンディング種別ごとの色・背景・速度
  const ENDING_STYLE = {
    good:    { bg:'#030e06', col:'var(--green)',  spd:28 },
    true:    { bg:'#0e0a02', col:'#f0c040',       spd:26 },
    neutral: { bg:'#050a12', col:'#8ab4cc',       spd:32 },
    secret:  { bg:'#08041a', col:'#b878ff',       spd:30 },
    bad:     { bg:'#0e0306', col:'#ff3355',       spd:38 },
  };
  const style = ENDING_STYLE[ev.result] || ENDING_STYLE.good;

  const scr = $('end-screen');
  const txt = $('end-text');
  scr.style.background = style.bg;
  txt.innerHTML = '';
  txt.style.color = style.col;
  scr.style.display = 'flex';

  for (const ch of ev.text) {
    if (ch === '\n') txt.appendChild(document.createElement('br'));
    else txt.insertAdjacentText('beforeend', ch);
    await sleep(style.spd);
  }

  await sleep(700);
  const t = document.createElement('div');
  t.style.cssText = `font-size:20px;margin-top:22px;letter-spacing:.3em;text-shadow:0 0 18px ${style.col};`;
  t.textContent = ev.title;
  txt.appendChild(t);

  await sleep(400);
  const tag = document.createElement('div');
  tag.style.cssText = 'font-size:14px;margin-top:10px;color:var(--dim);';
  tag.textContent = ev.tag;
  txt.appendChild(tag);

  // プレイ時間を表示
  await sleep(300);
  const timeEl = document.createElement('div');
  timeEl.style.cssText = 'font-size:12px;margin-top:12px;letter-spacing:.12em;color:rgba(255,255,255,.3);';
  timeEl.textContent   = 'PLAY TIME: ' + _fmtTime(_getElapsed());
  txt.appendChild(timeEl);
}

// ═══════════════════════════════════════════
// 星のアニメーション
// ═══════════════════════════════════════════

(function () {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  const COUNT = 30;
  let W, H, stars = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeStar(fromBottom) {
    return {
      x: rand(0, W),
      y: fromBottom ? rand(H * 0.5, H + 10) : rand(0, H),
      r: rand(0.5, 1.8),
      speed: rand(0.12, 0.45),
      opacity: rand(0.25, 0.8),
      drift: rand(-0.06, 0.06),
    };
  }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = Array.from({ length: COUNT }, () => makeStar(false));
  }

  function draw() {
    // 背景を毎フレーム塗りつぶす（canvas が page background を担う）
    ctx.fillStyle = '#080c1a';
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      s.y -= s.speed;
      s.x += s.drift;

      if (s.y + s.r < 0) {
        // 画面上端を超えたら下端からリスポーン
        Object.assign(s, makeStar(true));
        s.y = H + s.r;
      }

      ctx.save();
      ctx.globalAlpha = s.opacity;
      ctx.shadowBlur  = s.r * 5;
      ctx.shadowColor = 'rgba(160, 220, 255, 0.9)';
      ctx.fillStyle   = '#c8e8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

// ═══════════════════════════════════════════
// サウンド (Web Audio API)
// iOS Safari 対応: AudioContext はユーザー操作時に生成する
// ═══════════════════════════════════════════

const _ACtx = window.AudioContext || window.webkitAudioContext;
let _ac = null; // AudioContext インスタンス

// AudioContext を取得 or 再開（iOS は suspended になる場合がある）
function _getAC() {
  if (!_ac) _ac = new _ACtx();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}

// ── 選択肢クリック音 ──
// E5 + B5 の sine 2音による軽いベル音。短く澄んだ電子チャイム。
function playClick() {
  if (!_ac) return;
  const ac  = _getAC();
  const now = ac.currentTime;
  // [周波数Hz, ピーク音量, 減衰秒]
  [[659.25, 0.09, 0.20], [987.77, 0.04, 0.12]].forEach(([f, vol, dur]) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(vol, now + 0.007); // 瞬時の立ち上がり
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start(now);
    o.stop(now + dur + 0.01);
  });
}

// ── 記憶フラッシュバック音 ──
// Phase1: 星のまたたき (高域 sine パルス)
// Phase2: D 長調ペンタトニック昇降 (清らかなアルペジオ)
// Phase3: D メジャー和音の余韻 (幻想的に消えていく)
function playMemory() {
  if (!_ac) return;
  const ac  = _getAC();
  const now = ac.currentTime;
  const master = ac.createGain();
  master.gain.value = 0.22;
  master.connect(ac.destination);

  // Phase 1: 星のまたたき – A5,C#6,E6 の soft sine パルス (0 〜 0.36s)
  [[880.00, 0.07], [1108.73, 0.05], [1318.51, 0.03]].forEach(([f, vol], i) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    const t = now + i * 0.12;
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.20);
  });

  // Phase 2: D 長調ペンタトニック上昇 D4,E4,F#4,A4,B4,D5,E5,F#5 (0.4 〜 1.4s)
  [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25, 739.99].forEach((f, i) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    const t = now + 0.40 + i * 0.13;
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.13, t + 0.025);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.48);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 0.55);
  });

  // Phase 3: D メジャー和音の余韻 D5,F#5,A5 (1.45 〜 3.7s)
  [[587.33, 0.11], [739.99, 0.08], [880.00, 0.06]].forEach(([f, vol]) => {
    const o = ac.createOscillator();
    const g = ac.createGain();
    const t = now + 1.45;
    o.type = 'sine';
    o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.001, t + 2.3);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 2.5);
  });
}

let _hintKey   = null;
let _hintLevel = 0;

function getHintKey() {
  const inv   = P.inv;
  const flags = P.flags;

  // メインクエスト進行度を判定
  if (!inv.includes('data_chip')) {
    if (!flags.has('factory_unlocked')) {
      if (!inv.includes('ic_card')) {
        return P.visited.has('dark_alley') ? 'find_ic_card' : 'explore_alley';
      }
      return 'use_ic_card';
    }
    return 'find_data_chip';
  }

  if (!flags.has('rooftop_unlocked')) {
    if (!flags.has('knows_code')) {
      return inv.includes('memo') ? 'read_memo' : 'find_memo';
    }
    return inv.includes('burner_phone') ? 'use_burner_phone' : 'find_burner_phone';
  }

  return 'go_to_rooftop';
}

function _renderHint() {
  const hints  = HINT_DATA[_hintKey] || ['現在のヒントはありません。'];
  // イージー：全4レベル利用可  ノーマル：最大3レベル（インデックス0-2）
  const maxIdx = (_difficulty === 'easy') ? hints.length - 1 : Math.min(2, hints.length - 1);
  const total  = maxIdx + 1;
  $('hint-text').textContent      = hints[_hintLevel] || hints[hints.length - 1];
  $('hint-level-ind').textContent = `${_hintLevel + 1} / ${total}`;
  const moreBtn = $('hint-more-btn');
  const maxed   = _hintLevel >= maxIdx;
  moreBtn.disabled    = maxed;
  moreBtn.textContent = maxed ? 'これ以上のヒントはない' : 'さらに詳しく ▶';
}

function showHint() {
  if (_difficulty === 'hard') { _showMsg('ハードモードではヒントを使用できません'); return; }
  const key = getHintKey();
  if (key !== _hintKey) { _hintKey = key; _hintLevel = 0; }
  _renderHint();
  $('hint-overlay').style.display = 'flex';
}

function nextHint() {
  const hints  = HINT_DATA[_hintKey] || [];
  const maxIdx = (_difficulty === 'easy') ? hints.length - 1 : Math.min(2, hints.length - 1);
  if (_hintLevel < maxIdx) { _hintLevel++; _renderHint(); }
}

function closeHint() {
  $('hint-overlay').style.display = 'none';
}

  if (_charTimer) clearTimeout(_charTimer);
  const img = $('char-portrait');
  if (!img) return;

    _charTimer = setTimeout(() => { img.classList.remove('visible'); img.dataset.char = ''; }, delay);
  } else {
    img.classList.remove('visible');
    img.dataset.char = '';

}

let _difficulty = 'normal';  // 'easy' | 'normal' | 'hard'
let _startTime  = null;
let _elapsed    = 0;         // 累積ms（セーブ/ロード時に保持）
let _timerIntvl = null;

function startTimer() {
  _startTime  = Date.now();
  _timerIntvl = setInterval(_tickTimer, 1000);
  _tickTimer();
}

function pauseTimer() {
  if (_timerIntvl) { clearInterval(_timerIntvl); _timerIntvl = null; }
  if (_startTime)  { _elapsed += Date.now() - _startTime; _startTime = null; }
}

function _getElapsed() {
  return _elapsed + (_startTime ? Date.now() - _startTime : 0);
}

function _fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m % 60).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}

function _tickTimer() {
  const el = $('play-time');
  if (el) el.textContent = _fmtTime(_getElapsed());
}

function _applyDiffUI() {
  const labels = { easy:'EASY', normal:'NORMAL', hard:'HARD' };
  const dv = $('diff-val');
  if (dv) { dv.textContent = labels[_difficulty]; dv.className = 'inv-sub-val ' + _difficulty; }
  // ハードモードではヒントボタンを非表示
  const hb = $('hint-btn');
  if (hb) hb.style.display = (_difficulty === 'hard') ? 'none' : '';
}

const ACHIEVE_DEF = {
  awakened:   { name:'目覚めし者',     desc:'ゲームを初めてクリアした',                icon:'★' },
  full_mem:   { name:'完全記憶',       desc:'全ての記憶の断片を回収した',              icon:'◎' },
  collector:  { name:'コレクター',     desc:'全てのアイテムを集めた',                  icon:'◆' },
  true_ach:   { name:'真実の探求者',   desc:'トゥルーエンディングに到達した',          icon:'✦' },
  secret_ach: { name:'影の記録者',     desc:'シークレットエンディングに到達した',      icon:'▲' },
  normal_ach: { name:'逃亡者',         desc:'ノーマルエンディングに到達した',          icon:'▷' },
};

const _AK = 'nemesis2087_ach';
let _ach = {};
let _achTimer = null;

function _loadAch() {
  try { _ach = JSON.parse(localStorage.getItem(_AK) || '{}'); } catch(e) { _ach = {}; }
}

function _saveAch() {
  try { localStorage.setItem(_AK, JSON.stringify(_ach)); } catch(e) {}
}

function unlockAchievement(key) {
  if (_ach[key]) return;
  _ach[key] = Date.now();
  _saveAch();
  const def = ACHIEVE_DEF[key];
  if (!def) return;
  $('achv-toast-icon').textContent = def.icon;
  $('achv-toast-name').textContent = def.name;
  $('achv-toast').classList.add('show');
  if (_achTimer) clearTimeout(_achTimer);
  _achTimer = setTimeout(() => $('achv-toast').classList.remove('show'), 3500);
}

function checkCollector() {
  const all = Object.keys(ITEM).filter(id => !ITEM[id].fixed);
  if (all.every(id => P.inv.includes(id))) unlockAchievement('collector');
}

function checkFullMemory() {
  if (P.memCount === 7) unlockAchievement('full_mem');
}

function checkEndingAch(result) {
  // 'bad' エンドは「クリア」に含めない
  if (result === 'bad') return;

  // 特定エンディング実績を先に表示し、汎用「目覚めし者」を後から表示
  let specific = false;
  if (result === 'true')    { unlockAchievement('true_ach');   specific = true; }
  if (result === 'secret')  { unlockAchievement('secret_ach'); specific = true; }
  if (result === 'neutral') { unlockAchievement('normal_ach'); specific = true; }
  if (specific) setTimeout(() => unlockAchievement('awakened'), 4000);
  else unlockAchievement('awakened'); // good ending
}

function showAchievements() {
  const list = $('achv-list');
  list.innerHTML = '';
  Object.entries(ACHIEVE_DEF).forEach(([key, def]) => {
    const done = !!_ach[key];
    const el = document.createElement('div');
    el.className = 'achv-item ' + (done ? 'done' : 'lock');
    el.innerHTML =
      `<span class="achv-ico">${def.icon}</span>` +
      `<div class="achv-info">` +
        `<div class="achv-nm">${done ? def.name : '???'}</div>` +
        `<div class="achv-ds">${done ? def.desc : '未解除'}</div>` +
      `</div>`;
    list.appendChild(el);
  });
  $('achv-overlay').style.display = 'flex';
}

function closeAchievements() { $('achv-overlay').style.display = 'none'; }

const _SK = 'nemesis2087_save';
const _PK = 'nemesis2087_pend';
let _saveTimer = null;

function _showMsg(msg) {
  const el = $('save-toast');
  el.textContent = msg;
  el.classList.add('show');
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function saveGame() {
  try {
    const data = {
      loc: P.loc, inv: [...P.inv], memCount: P.memCount,
      flags: [...P.flags], visited: [...P.visited],
      elapsed: _getElapsed(), difficulty: _difficulty,
      savedAt: new Date().toLocaleString('ja-JP'),
    };
    localStorage.setItem(_SK, JSON.stringify(data));
    _showMsg('✓ セーブしました');
  } catch(e) { _showMsg('✕ セーブに失敗しました'); }
}

function loadGame() {
  const raw = localStorage.getItem(_SK);
  if (!raw) { _showMsg('セーブデータが見つかりません'); return; }
  let data;
  try { data = JSON.parse(raw); } catch(e) { _showMsg('データが破損しています'); return; }
  if (!confirm(`セーブデータをロードしますか？\n保存日時: ${data.savedAt || '不明'}\n現在の進行状況は失われます。`)) return;
  // ページリロード方式でゲームループの競合を回避
  localStorage.setItem(_PK, '1');
  location.reload();
}

// ページロード時にペンディングロードがあれば自動復元
function _applyPendingLoad() {
  if (!localStorage.getItem(_PK)) return false;
  localStorage.removeItem(_PK);
  const raw = localStorage.getItem(_SK);
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    P.loc       = d.loc        || 'hospital_room';
    P.inv       = d.inv        || [];
    P.memCount  = d.memCount   || 0;
    P.flags     = new Set(d.flags   || []);
    P.visited   = new Set(d.visited || []);
    _elapsed    = d.elapsed    || 0;
    _difficulty = d.difficulty || 'normal';
    return true;
  } catch(e) { return false; }
}

// ═══════════════════════════════════════════
// 起動
// ═══════════════════════════════════════════

async function startGame(diff = 'normal') {
  _difficulty = diff;
  _getAC();
  startTimer();
  $('title-screen').style.display = 'none';
  $('game-screen').style.display  = 'flex';
  hud(); refreshInv();
  _applyDiffUI();
  await tw('西暦2087年。あなたは目覚めた。', 'flavor', 28);
  await sleep(300);
  await showLoc(true);
  loop();
}

// ─── 初期化 ───
// 実績データをLocalStorageから復元
_loadAch();

// ページリロードによるロード復元（loadGame()からのリロード後）
(function () {
  if (!_applyPendingLoad()) return;
  // ロードデータあり → タイトルをスキップしてゲームを直接開始
  setTimeout(async () => {
    $('title-screen').style.display = 'none';
    $('game-screen').style.display  = 'flex';
    hud(); refreshInv();
    _getAC();
    _applyDiffUI();
    startTimer();
    await tw('ロードしました', 'pickup', 18);
    await sleep(200);
    await showLoc(false);
    loop();
  }, 50);
})();
</script>
